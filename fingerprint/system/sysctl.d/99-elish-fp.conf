# Keep high-order (order-7 = 512 KiB contiguous) blocks available for the
# Goodix QSEE TEE buffer pool used on every fingerprint verify. Under Waydroid
# memory pressure, order-7 blocks are otherwise exhausted and fprintd reports
# "pool-fprintd: page allocation failure" / "QSEE invoke: 无法分配内存".
vm.extfrag_threshold = 100
vm.compaction_proactiveness = 60
vm.min_free_kbytes = 131072
