name: Build Xiaomi Pad 5 Pro (elish) Fastboot Firmware

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: "构建模式（image-only 可直接复用历史构建的内核与用户态，无需重编）"
        required: true
        default: "full"
        type: choice
        options:
          - full
          - image-only
          - kernel-only
          - userspace-only
      reuse_run_id:
        description: "image-only 模式复用哪次 Workflow Run ID（留空则自动查找最近一次成功产物）"
        required: false
        default: ""
        type: string
      base_image_url:
        description: "Armbian noble GNOME 底包下载 URL（可自行修改，留空则使用默认地址）"
        required: false
        default: "https://armbian.lv.auroradev.org/archive/xiaomi-elish/archive/Armbian_25.2.2_Xiaomi-elish_noble_current_6.12.13_gnome_desktop.rootfs.img.xz"
        type: string
      boot_slot:
        description: "Linux 启动槽位（写入 boot.img cmdline 与 armbianEnv.txt）"
        required: true
        default: "boot_b"
        type: choice
        options:
          - boot_a
          - boot_b
      kernel_version:
        description: "Linux 内核版本（需与 kernel/config-used-* 匹配）"
        required: true
        default: "6.18.44"
        type: string
      armbian_commit:
        description: "Armbian build 仓库基线 commit（参见 kernel/ARMBIAN-BASELINE.md）"
        required: true
        default: "db44df750"
        type: string
      build_userspace:
        description: "full 模式下是否同时编译用户态二进制"
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KERNEL_VERSION: ${{ inputs.kernel_version || '6.18.44' }}
  KERNEL_TARBALL_SHA256: "0f72d938f06828e82c90405174fe572287db7bfe089e2fc46572a99a7f240d43"
  ARMBIAN_COMMIT: ${{ inputs.armbian_commit || 'db44df750' }}
  EXPECTED_KREL: "6.18.44-current-sm8250"
  BOOT_SLOT: ${{ inputs.boot_slot || 'boot_b' }}

jobs:
  build-kernel:
    name: Build Kernel, Modules & DTBs (CSOT + BOE)
    runs-on: ubuntu-24.04
    if: ${{ inputs.build_mode == 'full' || inputs.build_mode == 'kernel-only' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure >= 4GB swap for BTF (pahole)
        run: |
          set -euo pipefail
          swap_mb=$(free -m | awk '/^Swap:/ {print $2}')
          echo "Current swap: ${swap_mb} MB"
          if [ "${swap_mb:-0}" -lt 4096 ]; then
            sudo fallocate -l 4G /swapfile.elish || sudo dd if=/dev/zero of=/swapfile.elish bs=1M count=4096 status=none
            sudo chmod 600 /swapfile.elish
            sudo mkswap /swapfile.elish
            sudo swapon /swapfile.elish
            free -h
          fi

      - name: Install kernel cross-compile dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            bc bison flex libssl-dev libelf-dev dwarves device-tree-compiler \
            xz-utils curl git python3 cpio zstd kmod ca-certificates

      - name: Cache Linux source tarball
        id: cache-linux
        uses: actions/cache@v4
        with:
          path: /tmp/dl/linux-${{ env.KERNEL_VERSION }}.tar.xz
          key: linux-src-${{ env.KERNEL_VERSION }}

      - name: Download and verify Linux ${{ env.KERNEL_VERSION }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/dl
          TARBALL="/tmp/dl/linux-${KERNEL_VERSION}.tar.xz"
          if [ ! -f "$TARBALL" ]; then
            MAJOR="${KERNEL_VERSION%%.*}"
            curl -fL --retry 3 -o "$TARBALL" \
              "https://cdn.kernel.org/pub/linux/kernel/v${MAJOR}.x/linux-${KERNEL_VERSION}.tar.xz"
          fi
          if [ "$KERNEL_VERSION" = "6.18.44" ]; then
            echo "${KERNEL_TARBALL_SHA256}  ${TARBALL}" | sha256sum -c -
          fi

      - name: Cache Armbian build baseline
        id: cache-armbian
        uses: actions/cache@v4
        with:
          path: /tmp/armbian-build
          key: armbian-build-${{ env.ARMBIAN_COMMIT }}

      - name: Fetch Armbian build repo at ${{ env.ARMBIAN_COMMIT }}
        run: |
          set -euo pipefail
          if [ ! -d /tmp/armbian-build/.git ]; then
            git clone --filter=blob:none --no-checkout https://github.com/armbian/build.git /tmp/armbian-build
          fi
          git -C /tmp/armbian-build fetch --depth 1 origin "${ARMBIAN_COMMIT}" || git -C /tmp/armbian-build fetch origin
          git -C /tmp/armbian-build checkout -f "${ARMBIAN_COMMIT}"

      - name: Extract kernel and apply Armbian sm8250 baseline patches
        run: |
          set -euo pipefail
          mkdir -p /tmp/kbuild
          tar -xf "/tmp/dl/linux-${KERNEL_VERSION}.tar.xz" -C /tmp/kbuild
          KSRC="/tmp/kbuild/linux-${KERNEL_VERSION}"
          echo "KSRC=${KSRC}" >> "$GITHUB_ENV"

          touch "$KSRC/.scmversion"

          PATCH_DIR="/tmp/armbian-build/patch/kernel/archive/sm8250-6.18"
          if [ ! -d "$PATCH_DIR" ]; then
            echo "::error::找不到 Armbian 补丁目录: $PATCH_DIR"
            exit 1
          fi

          for p in "$PATCH_DIR"/*.patch; do
            [ -f "$p" ] || continue
            base=$(basename "$p")
            case "$base" in
              0063*)
                echo "Skipping Armbian patch $base (per kernel/ARMBIAN-BASELINE.md)"
                continue
                ;;
            esac
            [ -s "$p" ] || continue
            if patch -p1 -d "$KSRC" --dry-run --forward --batch < "$p" >/dev/null 2>&1; then
              patch -p1 -d "$KSRC" --forward --batch < "$p"
            elif patch -p1 -d "$KSRC" --dry-run --reverse --batch < "$p" >/dev/null 2>&1; then
              echo "Already applied Armbian patch: $base"
            else
              echo "::warning::Armbian patch did not apply cleanly: $base"
            fi
          done

      - name: Integrate fingerprint kernel files and headers
        run: |
          set -euo pipefail
          TAGK="${GITHUB_WORKSPACE}/kernel"
          cp -a "$TAGK/include/linux/firmware/qcom/qcom_scm.h" "$KSRC/include/linux/firmware/qcom/qcom_scm.h"
          cp -a "$TAGK/include/linux/soc/qcom/mdt_loader.h"   "$KSRC/include/linux/soc/qcom/mdt_loader.h"
          cp -a "$TAGK/include/uapi/linux/tee.h"              "$KSRC/include/uapi/linux/tee.h"

          mkdir -p "$KSRC/drivers/tee/qseecom"
          cp -a "$TAGK/qseecom/." "$KSRC/drivers/tee/qseecom/"
          cp -a "$TAGK/mdt_loader.c" "$KSRC/drivers/soc/qcom/mdt_loader.c"
          cp -a "$TAGK/qcom_scm.c"   "$KSRC/drivers/firmware/qcom/qcom_scm.c"

          if ! grep -q 'drivers/tee/qseecom/Kconfig' "$KSRC/drivers/tee/Kconfig"; then
            printf '\nsource "drivers/tee/qseecom/Kconfig"\n' >> "$KSRC/drivers/tee/Kconfig"
          fi
          if ! grep -q 'CONFIG_TEE_QSEECOM' "$KSRC/drivers/tee/Makefile"; then
            printf 'obj-$(CONFIG_TEE_QSEECOM) += qseecom/\n' >> "$KSRC/drivers/tee/Makefile"
          fi

      - name: Apply project kernel patches (0001-0017 + qseecom-pool-compact-retry)
        run: |
          set -euo pipefail
          TAGK="${GITHUB_WORKSPACE}/kernel"
          . "$TAGK/patch-lib.sh"

          apply_kpatch() {
            local p=$1
            [ -f "$p" ] || { echo "::error::Missing patch: $p"; exit 1; }
            if patch -p1 -d "$KSRC" --dry-run --forward --batch < "$p" >/dev/null 2>&1; then
              echo "Applying: $(basename "$p")"
              patch -p1 -d "$KSRC" --forward --batch < "$p"
            elif patch -p1 -d "$KSRC" --dry-run --reverse --batch < "$p" >/dev/null 2>&1; then
              echo "Already applied: $(basename "$p")"
            elif patch_content_present "$KSRC" "$p"; then
              echo "Already present (context drift $PATCH_PRESENT_STATS): $(basename "$p")"
            else
              echo "::error::Patch failed to apply: $(basename "$p")"
              exit 1
            fi
          }

          P="$TAGK/patches"
          for pf in \
            0001-fastrpc-sdsp-vmid-and-sensors-pd.patch \
            0002-pinctrl-lpass-lpi-defer-on-clock-timeout.patch \
            0004-smb5-typec-legacy-reset-resume.patch \
            0005-ov8856-bggr-vflip.patch \
            0006-ov13b10-of-supplies-reset.patch \
            0007-cn3927v.patch \
            0008-hi556-of.patch \
            0009-fastrpc-listener-unfreezable.patch \
            0010-smb5-fast-charge-current-vbus.patch \
            0011-charger-taper-stepdown.patch \
            0012-charger-soc-step-charging.patch \
            0013-charger-ignore-fullon-flag.patch \
            0014-bq2597x-probe-typec-notifier.patch \
            0015-bq2597x-soc-gated-charging.patch \
            0016-bq27xxx-discharging-status.patch \
            0017-pwrkey-post-resume-grace.patch \
            fingerprint/qseecom-pool-compact-retry.patch; do
            apply_kpatch "$P/$pf"
          done
          if ! grep -q 'tristate "Qualcomm MDT firmware loader"' "$KSRC/drivers/soc/qcom/Kconfig"; then
            apply_kpatch "$P/0003-qcom-mdt-loader-user-selectable.patch"
          fi

      - name: Ensure qcom_q6v5_pas auto_boot=true
        run: |
          set -euo pipefail
          Q6="$KSRC/drivers/remoteproc/qcom_q6v5_pas.c"
          if grep -q 'sdm845_slpi_resource_init = {' "$Q6"; then
            sed -i '/sdm845_slpi_resource_init = {/,/};/ s/\.auto_boot = false/.auto_boot = true/' "$Q6"
          fi

      - name: Configure kernel and verify required options
        run: |
          set -euo pipefail
          cp -a "${GITHUB_WORKSPACE}/kernel/config-used-6.18.44" "$KSRC/.config"
          make -C "$KSRC" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig

          for c in CONFIG_TEE=y CONFIG_TEE_QSEECOM=y CONFIG_QCOM_QSEECOM=y \
                   CONFIG_QCOM_MDT_LOADER=y CONFIG_QCOM_FASTRPC=m \
                   CONFIG_DEBUG_INFO_BTF=y CONFIG_MODULE_ALLOW_BTF_MISMATCH=y \
                   CONFIG_ANDROID_BINDERFS=y; do
            grep -q "^${c}$" "$KSRC/.config" || { echo "::error::Missing config: $c"; exit 1; }
          done
          grep -q '^CONFIG_LOCALVERSION="-current-sm8250"$' "$KSRC/.config"

          KREL=$(make -s -C "$KSRC" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- kernelrelease)
          echo "Built kernelrelease: $KREL"
          [ "$KREL" = "$EXPECTED_KREL" ] || { echo "::error::kernelrelease ($KREL) != $EXPECTED_KREL"; exit 1; }

      - name: Build kernel Image, modules, BOE fallback DTB & check ABI
        run: |
          set -euo pipefail
          make -C "$KSRC" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j"$(nproc)" Image modules
          make -C "$KSRC" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- qcom/sm8250-xiaomi-elish-boe.dtb || true

          echo "== ABI 三件套检查 =="
          strings "$KSRC/vmlinux" | grep -m1 mod_unload || true
          pahole -C module "$KSRC/vmlinux" | grep 'size:' || true

      - name: Build out-of-tree kernel modules (goodix_fp_spi & airoha_gps)
        run: |
          set -euo pipefail
          make -C "$KSRC" M="${GITHUB_WORKSPACE}/kernel/goodix_fp_spi" \
            ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- modules
          make -C "$KSRC" M="${GITHUB_WORKSPACE}/gnss/kernel" \
            ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- modules

      - name: Verify bundled combined DTB (CSOT)
        run: |
          set -euo pipefail
          bash "${GITHUB_WORKSPACE}/kernel/dtb/verify-combined-dtb.sh" \
            "${GITHUB_WORKSPACE}/kernel/dtb/sm8250-xiaomi-elish-csot.dtb"

      - name: Stage and package kernel firmware artifacts
        run: |
          set -euo pipefail
          OUT="/tmp/elish-kernel-out"
          mkdir -p "$OUT/boot" "$OUT/dtb" "$OUT/modules-extra" "$OUT/initramfs-hooks"

          cp -a "$KSRC/arch/arm64/boot/Image" "$OUT/boot/vmlinuz-${EXPECTED_KREL}"
          cp -a "$KSRC/.config" "$OUT/boot/config-${EXPECTED_KREL}"
          cp -a "$KSRC/System.map" "$OUT/boot/System.map-${EXPECTED_KREL}"

          CSOT_DTB="${GITHUB_WORKSPACE}/kernel/dtb/sm8250-xiaomi-elish-csot.dtb"
          cp -a "$CSOT_DTB" "$OUT/dtb/sm8250-xiaomi-elish-csot.dtb"

          BOE_DTB="$KSRC/arch/arm64/boot/dts/qcom/sm8250-xiaomi-elish-boe.dtb"
          if [ -f "$BOE_DTB" ]; then
            cp -a "$BOE_DTB" "$OUT/dtb/sm8250-xiaomi-elish-boe.dtb"
          fi

          cp -a "$KSRC/drivers/misc/fastrpc.ko" "$OUT/modules-extra/fastrpc.ko"
          cp -a "${GITHUB_WORKSPACE}/kernel/goodix_fp_spi/goodix_fp_spi.ko" "$OUT/modules-extra/goodix_fp_spi.ko"
          cp -a "${GITHUB_WORKSPACE}/gnss/kernel/airoha_gps.ko" "$OUT/modules-extra/airoha_gps.ko"

          make -C "$KSRC" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            INSTALL_MOD_PATH="$OUT/rootfs" INSTALL_MOD_STRIP=1 modules_install

          install -D -m 0644 "$OUT/modules-extra/goodix_fp_spi.ko" \
            "$OUT/rootfs/lib/modules/${EXPECTED_KREL}/extra/goodix_fp_spi.ko"
          install -D -m 0644 "$OUT/modules-extra/airoha_gps.ko" \
            "$OUT/rootfs/lib/modules/${EXPECTED_KREL}/extra/airoha_gps.ko"

          cp -a "${GITHUB_WORKSPACE}/kernel/initramfs/hooks/xiaomi-elish-firmware" \
            "$OUT/initramfs-hooks/xiaomi-elish-firmware"

          (cd "$OUT" && find boot dtb modules-extra initramfs-hooks -type f | sort | xargs sha256sum > SHA256SUMS)
          mkdir -p "${GITHUB_WORKSPACE}/dist"
          tar -C "$OUT" -czf "${GITHUB_WORKSPACE}/dist/elish-kernel-${EXPECTED_KREL}-arm64.tar.gz" .
          cp -a "$OUT/SHA256SUMS" "${GITHUB_WORKSPACE}/dist/kernel-SHA256SUMS.txt"

      - name: Upload kernel build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: elish-kernel-${{ env.EXPECTED_KREL }}-arm64
          path: |
            dist/elish-kernel-*.tar.gz
            dist/kernel-SHA256SUMS.txt
          retention-days: 30

  build-userspace:
    name: Build Userspace Binaries (QEMU arm64 Ubuntu 24.04)
    runs-on: ubuntu-24.04
    if: ${{ (inputs.build_mode == 'full' && inputs.build_userspace) || inputs.build_mode == 'userspace-only' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU for arm64
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build userspace components inside arm64 Ubuntu 24.04 container
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/dist"
          docker run --rm --platform linux/arm64 \
            -v "${GITHUB_WORKSPACE}:/work" \
            -w /work \
            ubuntu:24.04 \
            bash -euo pipefail -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -y \
                build-essential gcc make git meson ninja-build pkg-config ca-certificates \
                python3 python3-pip gobject-introspection libglib2.0-dev libgudev-1.0-dev \
                libpolkit-gobject-1-dev libqmi-glib-dev libmbim-glib-dev libqrtr-glib-dev \
                libprotobuf-c-dev protobuf-c-compiler protobuf-compiler libnss3-dev \
                libgusb-dev libusb-1.0-0-dev libpixman-1-dev libcairo2-dev \
                libgirepository1.0-dev libssl-dev libegl-dev libgles-dev libdrm-dev \
                libgbm-dev libpipewire-0.3-dev zlib1g-dev libpam0g-dev libsystemd-dev \
                systemd-dev udev

              pip3 install --break-system-packages --upgrade "meson>=1.4.0"
              hash -r
              meson --version

              OUT=/tmp/elish-userspace-out
              BUILD=/tmp/elish-userspace-build
              mkdir -p "$OUT" "$BUILD"

              # 1) hexagonrpcd (v0.3.2 + warm-attach + M2 writable registry + regver-v1)
              git clone --depth 1 --branch v0.3.2 https://github.com/linux-msm/hexagonrpc.git "$BUILD/hexagonrpc"
              for p in \
                0001-hexrpc-0.3.2-warm-attach.patch \
                0003-hexagonrpcd-add-writable-hexagonfs.patch \
                0004-hexagonrpcd-support-writable-sensor-registry.patch \
                0005-hexagonrpcd-support-large-and-extended-callbacks.patch; do
                git -C "$BUILD/hexagonrpc" apply "/work/sensors/userspace/hexrpc/patches/$p"
              done
              meson setup "$BUILD/hexagonrpc/build" "$BUILD/hexagonrpc" --prefix=/opt/hexrpc-032b
              ninja -C "$BUILD/hexagonrpc/build"
              DESTDIR="$OUT" ninja -C "$BUILD/hexagonrpc/build" install
              install -D -m 0755 "$BUILD/hexagonrpc/build/hexagonrpcd/hexagonrpcd" \
                "$OUT/opt/hexrpc-032b/bin/hexagonrpcd.writable-v1"
              install -D -m 0755 "$BUILD/hexagonrpc/build/hexagonrpcd/hexagonrpcd" \
                "$OUT/opt/hexrpc-032b/bin/hexagonrpcd"

              git clone --depth 1 --branch v0.3.2 https://github.com/linux-msm/hexagonrpc.git "$BUILD/hexagonrpc-regver"
              git -C "$BUILD/hexagonrpc-regver" apply /work/sensors/userspace/hexrpc/patches/0001-hexrpc-0.3.2-warm-attach.patch
              git -C "$BUILD/hexagonrpc-regver" apply /work/sensors/userspace/hexrpc/patches/0002-hexrpc-0.3.2-registry-version.patch
              meson setup "$BUILD/hexagonrpc-regver/build" "$BUILD/hexagonrpc-regver" --prefix=/opt/hexrpc-032b
              ninja -C "$BUILD/hexagonrpc-regver/build"
              install -D -m 0755 "$BUILD/hexagonrpc-regver/build/hexagonrpcd/hexagonrpcd" \
                "$OUT/opt/hexrpc-032b/bin/hexagonrpcd.regver-v1"

              # 2) libssc
              git clone https://codeberg.org/mmcallister/libssc.git "$BUILD/libssc"
              git -C "$BUILD/libssc" checkout -f 4e4c6c8cc702a754bd700506c01961aaf971a23b
              LIBSSC_OPTS=(--prefix=/usr/local)
              if grep -qE "option\(['\''\"]introspection['\''\"]" "$BUILD/libssc/meson.options" "$BUILD/libssc/meson_options.txt" 2>/dev/null; then
                LIBSSC_OPTS+=(-Dintrospection=false)
              fi
              meson setup "$BUILD/libssc/build" "$BUILD/libssc" "${LIBSSC_OPTS[@]}"
              ninja -C "$BUILD/libssc/build"
              ninja -C "$BUILD/libssc/build" install
              DESTDIR="$OUT" ninja -C "$BUILD/libssc/build" install
              ldconfig
              export PKG_CONFIG_PATH="/usr/local/lib/aarch64-linux-gnu/pkgconfig:/usr/local/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"

              # 3) iio-sensor-proxy
              git clone https://gitlab.freedesktop.org/hadess/iio-sensor-proxy.git "$BUILD/iio-sensor-proxy"
              git -C "$BUILD/iio-sensor-proxy" checkout -f ca0d5b0
              git -C "$BUILD/iio-sensor-proxy" apply \
                /work/sensors/userspace/iio-sensor-proxy/patches/0001-iio-sensor-proxy-hotplug-stayalive.patch
              meson setup "$BUILD/iio-sensor-proxy/build" "$BUILD/iio-sensor-proxy" \
                --prefix=/usr -Dssc-support=enabled
              ninja -C "$BUILD/iio-sensor-proxy/build"
              DESTDIR="$OUT" ninja -C "$BUILD/iio-sensor-proxy/build" install

              # 4) qsee-supplicant & qsee-app-loader
              make -C /work/fingerprint/src/qsee-supplicant
              make -C /work/fingerprint/src/qsee-supplicant check
              make -C /work/fingerprint/src/qsee-supplicant DESTDIR="$OUT" install-bin install-systemd install-doc

              # 5) libfprint (goodixqsee)
              git clone https://github.com/wrobelda/libfprint.git "$BUILD/libfprint"
              git -C "$BUILD/libfprint" checkout -f 430e24e538ba137b6edcfe2e1b3b8cc29c66fa6a
              git -C "$BUILD/libfprint" apply \
                /work/fingerprint/src/libfprint/patches/libfprint-goodixqsee-logging.patch
              meson setup "$BUILD/libfprint/build" "$BUILD/libfprint" --prefix=/usr \
                -Ddrivers=goodixqsee -Ddoc=false -Dinstalled-tests=false \
                -Dgtk-examples=false -Dintrospection=true
              ninja -C "$BUILD/libfprint/build"
              DESTDIR="$OUT" ninja -C "$BUILD/libfprint/build" install

              # 6) GNSS userspace
              make -C /work/gnss/userspace
              make -C /work/gnss/userspace DESTDIR="$OUT" install

              # 7) Camera userspace
              make -C /work/camera/elish-camera
              install -D -m 0755 /work/camera/elish-camera/build/elish-camera "$OUT/usr/local/bin/elish-camera"
              for t in debayer_test enc_test loopback_test capture_test; do
                install -D -m 0755 "/work/camera/elish-camera/build/$t" "$OUT/usr/local/lib/elish-camera/$t"
              done

              # 8) bioauth
              make -C /work/bioauth
              make -C /work/bioauth DESTDIR="$OUT" install

              (cd "$OUT" && find . -type f | sed "s|^\./||" | sort | xargs sha256sum > SHA256SUMS)
              tar -C "$OUT" -czf /work/dist/elish-userspace-arm64.tar.gz .
              cp -a "$OUT/SHA256SUMS" /work/dist/userspace-SHA256SUMS.txt
            '

      - name: Upload userspace build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: elish-userspace-arm64
          path: |
            dist/elish-userspace-arm64.tar.gz
            dist/userspace-SHA256SUMS.txt
          retention-days: 30

  build-image:
    name: Assemble Fastboot Images (boot-csot.img, boot-boe.img, rootfs.img)
    needs: [build-kernel, build-userspace]
    if: ${{ !failure() && !cancelled() && (inputs.build_mode == 'full' || inputs.build_mode == 'image-only') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve artifact source run ID
        id: resolve-run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.build_mode }}" = "full" ]; then
            echo "run_id=${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          RID="${{ inputs.reuse_run_id }}"
          if [ -z "$RID" ]; then
            RID=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '
              [.artifacts[] | select(.expired == false and .name == "elish-kernel-'"${EXPECTED_KREL}"'-arm64")]
              | sort_by(.created_at) | reverse | .[0].workflow_run.id // empty
            ')
          fi
          [ -n "$RID" ] || { echo "::error::未找到可复用的历史内核构建产物，请先运行一次 full 构建或手动填写 reuse_run_id"; exit 1; }
          echo "Reusing artifacts from Workflow Run ID: $RID"
          echo "run_id=$RID" >> "$GITHUB_OUTPUT"

      - name: Download kernel and userspace artifacts
        uses: actions/download-artifact@v4
        with:
          path: /tmp/artifacts
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.resolve-run.outputs.run_id }}

      - name: Set up QEMU for arm64
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Install host image-building tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            curl xz-utils zstd unzip tar e2fsprogs mkbootimg android-sdk-libsparse-utils \
            util-linux parted kpartx qemu-user-static binfmt-support uuid-runtime python3

      - name: Download Armbian noble GNOME base image
        run: |
          set -euo pipefail
          mkdir -p /tmp/base-img
          DEFAULT_URL="https://armbian.lv.auroradev.org/archive/xiaomi-elish/archive/Armbian_25.2.2_Xiaomi-elish_noble_current_6.12.13_gnome_desktop.rootfs.img.xz"
          URL="${{ inputs.base_image_url }}"
          if [ -z "$URL" ]; then
            URL="$DEFAULT_URL"
          fi
          echo "Using Armbian base image URL: $URL"

          fname="/tmp/base-img/$(basename "${URL%%\?*}")"
          curl -fL --retry 3 -o "$fname" "$URL"

          case "$fname" in
            *.img.xz) xz -d -T0 "$fname"; IMG="${fname%.xz}" ;;
            *.img.zst) zstd -d --rm "$fname"; IMG="${fname%.zst}" ;;
            *.img.gz) gzip -d "$fname"; IMG="${fname%.gz}" ;;
            *.tar.xz) tar -xf "$fname" -C /tmp/base-img; IMG=$(find /tmp/base-img -maxdepth 2 -name '*.img' | head -n1) ;;
            *.zip) unzip -o "$fname" -d /tmp/base-img; IMG=$(find /tmp/base-img -maxdepth 2 -name '*.img' | head -n1) ;;
            *.img) IMG="$fname" ;;
            *) echo "::error::不支持的底包格式: $fname"; exit 1 ;;
          esac
          [ -n "${IMG:-}" ] && [ -f "$IMG" ] || { echo "::error::解压后未找到 .img 文件"; exit 1; }
          echo "BASE_IMG=$IMG" >> "$GITHUB_ENV"

      - name: Inject kernel, modules, userspace & assemble boot-csot.img, boot-boe.img, rootfs.img
        run: |
          set -euo pipefail
          STAGE="/tmp/elish-rootfs"
          SRC_MNT="/tmp/src-mnt"
          mkdir -p "$STAGE" "$SRC_MNT"

          # 智能查找并挂载真正的 rootfs 分区（避免整盘镜像有多个 ext4 分区时误挂到 /boot）
          FOUND_ROOTFS=0
          if blkid -s TYPE -o value "$BASE_IMG" 2>/dev/null | grep -q ext4; then
            sudo mount -o loop,ro "$BASE_IMG" "$SRC_MNT"
            if [ -f "$SRC_MNT/etc/os-release" ]; then
              sudo cp -a "$SRC_MNT/." "$STAGE/"
              FOUND_ROOTFS=1
            fi
            sudo umount "$SRC_MNT"
          fi

          if [ "$FOUND_ROOTFS" = 0 ]; then
            LOOP=$(sudo losetup -fP --show "$BASE_IMG")
            for PART in $(lsblk -ln -o PATH,FSTYPE "$LOOP" | awk '$2=="ext4" {print $1}'); do
              sudo mount -o ro "$PART" "$SRC_MNT"
              if [ -f "$SRC_MNT/etc/os-release" ]; then
                echo "Found rootfs partition: $PART"
                sudo cp -a "$SRC_MNT/." "$STAGE/"
                FOUND_ROOTFS=1
                sudo umount "$SRC_MNT"
                break
              fi
              sudo umount "$SRC_MNT"
            done
            sudo losetup -d "$LOOP"
          fi

          [ "$FOUND_ROOTFS" = 1 ] || { echo "::error::在底包镜像中未找到包含 /etc/os-release 的 ext4 rootfs 分区"; exit 1; }
          [ -e "$STAGE/lib/ld-linux-aarch64.so.1" ] || [ -e "$STAGE/usr/lib/aarch64-linux-gnu/ld-linux-aarch64.so.1" ] || {
            echo "::error::底包 rootfs 中缺少 ld-linux-aarch64.so.1"
            ls -la "$STAGE" "$STAGE/lib" 2>/dev/null || true
            exit 1
          }

          # 1) 注入本次编译的内核、模块与 initramfs hook
          KEXTR="/tmp/k-unpack"
          mkdir -p "$KEXTR"
          tar -xzf "/tmp/artifacts/elish-kernel-${EXPECTED_KREL}-arm64.tar.gz" -C "$KEXTR"

          sudo cp -a "$KEXTR/boot/vmlinuz-${EXPECTED_KREL}" "$STAGE/boot/vmlinuz-${EXPECTED_KREL}"
          sudo cp -a "$KEXTR/boot/config-${EXPECTED_KREL}"  "$STAGE/boot/config-${EXPECTED_KREL}"
          sudo cp -a "$KEXTR/boot/System.map-${EXPECTED_KREL}" "$STAGE/boot/System.map-${EXPECTED_KREL}"
          sudo cp -a "$KEXTR/rootfs/lib/modules/${EXPECTED_KREL}" "$STAGE/lib/modules/"

          sudo install -d "$STAGE/usr/lib/linux-image-${EXPECTED_KREL}/qcom" "$STAGE/boot/dtb-${EXPECTED_KREL}/qcom"
          sudo install -m 0644 "$KEXTR/dtb/sm8250-xiaomi-elish-csot.dtb" \
            "$STAGE/usr/lib/linux-image-${EXPECTED_KREL}/qcom/sm8250-xiaomi-elish-csot.dtb"
          sudo install -m 0644 "$KEXTR/dtb/sm8250-xiaomi-elish-csot.dtb" \
            "$STAGE/boot/dtb-${EXPECTED_KREL}/qcom/sm8250-xiaomi-elish-csot.dtb"

          if [ -f "$KEXTR/dtb/sm8250-xiaomi-elish-boe.dtb" ]; then
            sudo install -m 0644 "$KEXTR/dtb/sm8250-xiaomi-elish-boe.dtb" \
              "$STAGE/usr/lib/linux-image-${EXPECTED_KREL}/qcom/sm8250-xiaomi-elish-boe.dtb"
            sudo install -m 0644 "$KEXTR/dtb/sm8250-xiaomi-elish-boe.dtb" \
              "$STAGE/boot/dtb-${EXPECTED_KREL}/qcom/sm8250-xiaomi-elish-boe.dtb"
          fi

          sudo install -D -m 0755 "$KEXTR/initramfs-hooks/xiaomi-elish-firmware" \
            "$STAGE/etc/initramfs-tools/hooks/xiaomi-elish-firmware"
          printf 'goodix_fp_spi\n' | sudo tee "$STAGE/etc/modules-load.d/goodix-fp.conf" >/dev/null
          printf 'airoha_gps\n'    | sudo tee "$STAGE/etc/modules-load.d/airoha-gps.conf" >/dev/null

          # 2) 注入编译好的全部用户态二进制
          if [ -f /tmp/artifacts/elish-userspace-arm64.tar.gz ]; then
            sudo tar --no-overwrite-dir -xzf /tmp/artifacts/elish-userspace-arm64.tar.gz -C "$STAGE"
          fi

          # 3) 将本驱动包随镜像放入 /opt/xiaomi-elish-driver-pack
          sudo mkdir -p "$STAGE/opt/xiaomi-elish-driver-pack"
          sudo cp -a "${GITHUB_WORKSPACE}/." "$STAGE/opt/xiaomi-elish-driver-pack/"

          # 4) 生成统一 ext4 UUID 并写入 /etc/fstab 与 /boot/armbianEnv.txt
          ROOT_UUID=$(uuidgen)
          echo "Generated rootfs UUID: $ROOT_UUID (slot=$BOOT_SLOT)"
          if [ -f "$STAGE/etc/fstab" ]; then
            sudo sed -i -E "s|^UUID=[^[:space:]]+[[:space:]]+/([[:space:]])|UUID=${ROOT_UUID} /\\1|" "$STAGE/etc/fstab"
          fi
          if [ -f "$STAGE/boot/armbianEnv.txt" ]; then
            if grep -q '^abl_boot_partition_label=' "$STAGE/boot/armbianEnv.txt"; then
              sudo sed -i "s|^abl_boot_partition_label=.*|abl_boot_partition_label=${BOOT_SLOT}|" "$STAGE/boot/armbianEnv.txt"
            else
              printf '\nabl_boot_partition_label=%s\n' "$BOOT_SLOT" | sudo tee -a "$STAGE/boot/armbianEnv.txt" >/dev/null
            fi
          fi

          # 5) 在 arm64 chroot 内运行 depmod、ldconfig、生成 initrd.img
          sudo cp -a /usr/bin/qemu-aarch64-static "$STAGE/usr/bin/qemu-aarch64-static"
          sudo mount --bind /proc "$STAGE/proc"
          sudo mount --bind /sys "$STAGE/sys"
          sudo mount --bind /dev "$STAGE/dev"
          sudo mount --bind /dev/pts "$STAGE/dev/pts"
          sudo chroot "$STAGE" /bin/bash -euo pipefail -c "
            ldconfig
            depmod -a ${EXPECTED_KREL}
            update-initramfs -c -k ${EXPECTED_KREL}
          "
          sudo umount -lf "$STAGE/dev/pts" "$STAGE/dev" "$STAGE/proc" "$STAGE/sys"

          INITRD="$STAGE/boot/initrd.img-${EXPECTED_KREL}"
          [ -f "$INITRD" ] || { echo "::error::缺少生成的 initrd: $INITRD"; exit 1; }
          if lsinitramfs "$INITRD" 2>/dev/null | grep -Eq 'elish/slpi(\.mbn|\.b[0-9]+)$'; then
            echo "::error::initramfs 意外包含了 SLPI 固件！"
            exit 1
          fi

          # 6) 打包 boot-csot.img 与 boot-boe.img（共享同一内核与 initrd，仅 DTB 不同）
          OUT_FW="${GITHUB_WORKSPACE}/dist/fastboot-firmware"
          mkdir -p "$OUT_FW"
          EXTRA_ARGS=""
          if [ -f "$STAGE/boot/armbianEnv.txt" ]; then
            EXTRA_ARGS=$(sed -n 's/^[[:space:]]*extraargs[[:space:]]*=[[:space:]]*//p' "$STAGE/boot/armbianEnv.txt" | tail -1 | tr -d '\r' || true)
          fi
          CMDLINE="root=UUID=${ROOT_UUID} slot_suffix=${BOOT_SLOT#boot} ${EXTRA_ARGS}"

          gzip -c "$STAGE/boot/vmlinuz-${EXPECTED_KREL}" > /tmp/Image.gz
          for panel in csot boe; do
            DTB_PATH="$STAGE/usr/lib/linux-image-${EXPECTED_KREL}/qcom/sm8250-xiaomi-elish-${panel}.dtb"
            if [ -f "$DTB_PATH" ]; then
              cat /tmp/Image.gz "$DTB_PATH" > "/tmp/Image.gz-dtb-${panel}"
              mkbootimg \
                --kernel "/tmp/Image.gz-dtb-${panel}" \
                --ramdisk "$INITRD" \
                --base 0x0 \
                --second_offset 0x00f00000 \
                --cmdline "$CMDLINE" \
                --kernel_offset 0x8000 \
                --ramdisk_offset 0x1000000 \
                --tags_offset 0x100 \
                --pagesize 4096 \
                -o "$OUT_FW/boot-${panel}.img"
              rm -f "/tmp/Image.gz-dtb-${panel}"
            fi
          done
          rm -f /tmp/Image.gz

          # 7) 生成 rootfs.img（ext4，含余量空间后转为 fastboot 可刷镜像）
          USED_MB=$(sudo du -sm "$STAGE" | awk '{print $1}')
          IMG_MB=$((USED_MB + 1024))
          truncate -s "${IMG_MB}M" "$OUT_FW/rootfs.raw.img"
          sudo mkfs.ext4 -F -U "$ROOT_UUID" -L armbian_root -d "$STAGE" "$OUT_FW/rootfs.raw.img"
          sudo e2fsck -fy "$OUT_FW/rootfs.raw.img" || true
          img2simg "$OUT_FW/rootfs.raw.img" "$OUT_FW/rootfs.img"
          rm -f "$OUT_FW/rootfs.raw.img"

          cat > "$OUT_FW/FLASH-README.txt" <<EOF
          Xiaomi Pad 5 Pro (elish) Fastboot 刷机说明
          =========================================
          1. 根据你的屏幕面板选择 boot-csot.img（CSOT，项目已实测）或 boot-boe.img（BOE，未实测）：
             fastboot flash ${BOOT_SLOT} boot-csot.img
             # 若为 BOE 面板：
             # fastboot flash ${BOOT_SLOT} boot-boe.img

          2. 刷入根文件系统（rootfs.img 为 Android sparse ext4 格式，UUID=${ROOT_UUID}）：
             fastboot flash linux rootfs.img

          3. 重启：
             fastboot reboot

          注意：专有设备固件（slpi.mbn、vendor 传感器配置、gfenu.* 指纹 TA）不随公开构建提供；
          开机后可直接在 /opt/xiaomi-elish-driver-pack 下按 README.md 提取并运行安装/自检。
          EOF

          (cd "$OUT_FW" && sha256sum *.img FLASH-README.txt > SHA256SUMS)
          tar -C "$OUT_FW" -czf "${GITHUB_WORKSPACE}/dist/elish-fastboot-firmware-${BOOT_SLOT}.tar.gz" .

      - name: Upload complete fastboot firmware package
        uses: actions/upload-artifact@v4
        with:
          name: elish-fastboot-firmware-${{ env.BOOT_SLOT }}
          path: dist/elish-fastboot-firmware-*.tar.gz
          retention-days: 30
