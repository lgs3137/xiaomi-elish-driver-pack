# /etc/default/elish-pogo-kb —— pogo 键盘唤醒自动复位配置
# 修改后无需重启；下一次 suspend/resume 生效（复位脚本每次由 hook 重新读取本文件）。

# 1 = 启用（默认）；0 = 停用（hook 直接退出，不碰 GPIO）
ENABLED=1

# 唤醒后延迟多少秒执行复位。等 USB/xHCI resume 完成：
#   1s 时机曾在 sleep-post 中直接操作导致硬死机；3s 已实测安全。
DELAY_SEC=3

# 键盘 reset GPIO：TLMM 引脚号（elish = TLMM 141，对应 sysfs global = base + 141）
RST_GPIO=141

# TLMM gpiochip 的 label（用于在 /sys/class/gpio/gpiochip* 中定位 base，不要随意改）
TLMM_LABEL=f100000.pinctrl

# 复位脉冲宽度（毫秒）：拉低这么久再拉高；20–900 之间有效
PULSE_MS=150
